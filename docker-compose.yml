services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hospital}
      POSTGRES_USER: ${DB_USER:-hospitalapi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hospitalapi123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - hospital-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  hospital-postgres-data:
