spring.application.name=hospital-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:hospital}}
spring.datasource.username=${DB_USER:hospitalapi}
spring.datasource.password=${DB_PASSWORD:hospitalapi123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

logging.level.root=INFO
logging.level.br.com.hospital=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
app.jwt.secret=${JWT_SECRET:}
app.jwt.local-secret-file=${JWT_LOCAL_SECRET_FILE:${user.home}/.hospital-inteligente/jwt-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
app.monitor.api-key=${MONITOR_API_KEY:}
